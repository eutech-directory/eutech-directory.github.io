name: Build site
on:
  push:
    paths:
      - "data/**"
      - "site_template.html"
      - "build_site.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages from data/
        run: python build_site.py
      - name: Commit the rebuilt pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html mcp-servers tools category sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Rebuild site from data/"
            git push
          fi
